# Frozen retrieval-eval query set — v1 (2026-07-11, v3 session 7)
#
# Purpose: P-023 §7 step 7 / DD-070 §8's "measured retrieval win". This set is
# FROZEN: judging what counts as a gold answer is agent+user work (DP-001) and
# was done once, here; runs against this file are mechanical and comparable
# across time. Do not edit casually — a changed query set breaks comparability.
# Extend by appending (bump the version note above) rather than rewording.
#
# Provenance: queries are mined from real agent usage of this corpus —
# session-handoff "first commands", WF-006's survey/theme query menu, OBS-005's
# recorded retrieval miss, OBS-009's recorded live query, and the corpus's own
# DISC/OQ/FRICTION questions rephrased from the asking side (how an agent asks
# BEFORE knowing the answer record's title, not an echo of the title).
#
# Fields:
#   query    — natural-language question as an agent would pose it
#   gold     — record ids that answer it, directly or one obvious hop away
#              (a hit on ANY gold counts; sets kept to 1-3, verified against
#              the live corpus 2026-07-11, 249 vertices)
#   category — decision-lookup | semantic | lineage | friction | vocab |
#              process | question-lookup
#   note     — why the gold is the gold
queries:
  - id: q01
    query: "which decision made disk files the source of truth instead of the database"
    gold: [DD-070, PROPOSAL-023]
    category: decision-lookup
    note: "DD-070 commitment 2; P-023 is its storage spec"
  - id: q02
    query: "why was the workflow engine removed from docdog"
    gold: [DD-070, DD-066]
    category: decision-lookup
    note: "DD-070 commitment 1 enforces DD-066"
  - id: q03
    query: "should docdog execute process steps itself or just store the process documents"
    gold: [DD-066, EJ-030, CONCEPT-COLLECTION-WORKFLOWS]
    category: semantic
    note: "memory layer, not workflow engine; EJ-030 is the superseded original; the workflows concept record states it directly ('agents read and follow them; docdog stores and serves') — added pre-freeze after the first run showed it ranked #1 and genuinely answers"
  - id: q04
    query: "are cross-record relationships inferred from prose or declared somewhere"
    gold: [DD-043]
    category: decision-lookup
    note: "relationships come from frontmatter blocks, not agentic extraction"
  - id: q05
    query: "what did we replace ArangoDB with"
    gold: [DD-070, PROPOSAL-023]
    category: decision-lookup
    note: "embedded SQLite cache (FTS5 + vectors)"
  - id: q06
    query: "does reindexing recompute embeddings for unchanged files"
    gold: [DD-051, EJ-015]
